<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#092d20">
  <title>Melooloo · Greenhouse Company Profile Loop</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071b15;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
    main{position:relative;width:100vw;height:100dvh;display:grid;place-items:center}
    video{width:100%;height:100%;object-fit:contain;background:#071b15;outline:none}
    .tools{position:absolute;right:20px;bottom:20px;display:flex;gap:10px;opacity:.15;transition:opacity .3s}
    main:hover .tools,main:focus-within .tools{opacity:1}
    button{appearance:none;border:1px solid rgba(255,255,255,.5);border-radius:100px;padding:12px 16px;background:rgba(5,43,31,.84);color:#fff;font:600 14px Arial,Helvetica,sans-serif;cursor:pointer;backdrop-filter:blur(10px)}
    button:hover{background:#194c35}button:focus-visible{outline:3px solid #c4ea83;outline-offset:3px}
    .start{position:absolute;inset:0;display:none;place-items:center;background:rgba(3,25,17,.64)}
    .start.show{display:grid}.start button{font-size:18px;padding:16px 25px}
    @media (prefers-reduced-motion:reduce){.tools{transition:none}}
  </style>
</head>
<body>
  <main id="screen">
    <video id="film" src="melooloo_greenhouse_company_profile_loop.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="auto" aria-label="Video visualisasi konsep seluruh area greenhouse Melooloo, 56 detik tanpa suara"></video>
    <div id="start" class="start"><button id="startButton" type="button">Putar video</button></div>
    <div class="tools" aria-label="Kontrol pemutaran">
      <button id="playButton" type="button" aria-label="Jeda video">Jeda</button>
      <button id="fullButton" type="button">Layar penuh</button>
    </div>
  </main>
  <script>
    const video=document.getElementById('film');
    const screen=document.getElementById('screen');
    const start=document.getElementById('start');
    const playButton=document.getElementById('playButton');
    function sync(){playButton.textContent=video.paused?'Putar':'Jeda';playButton.setAttribute('aria-label',video.paused?'Putar video':'Jeda video')}
    function play(){video.play().then(()=>{start.classList.remove('show');sync()}).catch(()=>start.classList.add('show'))}
    document.getElementById('startButton').addEventListener('click',play);
    playButton.addEventListener('click',()=>{if(video.paused)play();else{video.pause();sync()}});
    document.getElementById('fullButton').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else screen.requestFullscreen()});
    document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')screen.requestFullscreen();if(e.key===' '){e.preventDefault();playButton.click()}});
    video.addEventListener('pause',sync);video.addEventListener('play',sync);
    play();
  </script>
</body>
</html>
